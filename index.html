<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="המרתף">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>המרתף</title>
<script>
try{var t=localStorage.getItem("cel-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>
<style>
/* tokens */
:root{
  --bg:#F2F2F7;--cell:#FFFFFF;--sheet:#F2F2F7;--sheet-cell:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);
  --fill:rgba(118,118,128,.12);--fill-press:rgba(0,0,0,.06);--seg-sel:#FFFFFF;
  --tint:#007AFF;--red:#FF3B30;--green:#34C759;--teal:#30B0C7;--indigo:#5856D6;--orange:#FF9500;--gray:#8E8E93;--wine:#A0153E;
  --green-text:#248A3D;--red-text:#D70015;--orange-text:#C93400;--indigo-text:#5856D6;--wine-text:#A0153E;
  --bar:rgba(249,249,249,.8);--as-bg:rgba(249,249,249,.92);--scrim:rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--cell:#1C1C1E;--sheet:#1C1C1E;--sheet-cell:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --fill:rgba(118,118,128,.24);--fill-press:rgba(255,255,255,.08);--seg-sel:#636366;
  --tint:#0A84FF;--red:#FF453A;--green:#30D158;--teal:#40C8E0;--indigo:#5E5CE6;--orange:#FF9F0A;--gray:#8E8E93;--wine:#E0365F;
  --green-text:#30D158;--red-text:#FF453A;--orange-text:#FF9F0A;--indigo-text:#7D7AFF;--wine-text:#FF6482;
  --bar:rgba(22,22,22,.82);--as-bg:rgba(44,44,46,.94);--scrim:rgba(0,0,0,.55);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000;--cell:#1C1C1E;--sheet:#1C1C1E;--sheet-cell:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --fill:rgba(118,118,128,.24);--fill-press:rgba(255,255,255,.08);--seg-sel:#636366;
  --tint:#0A84FF;--red:#FF453A;--green:#30D158;--teal:#40C8E0;--indigo:#5E5CE6;--orange:#FF9F0A;--gray:#8E8E93;--wine:#E0365F;
  --green-text:#30D158;--red-text:#FF453A;--orange-text:#FF9F0A;--indigo-text:#7D7AFF;--wine-text:#FF6482;
  --bar:rgba(22,22,22,.82);--as-bg:rgba(44,44,46,.94);--scrim:rgba(0,0,0,.55);color-scheme:dark;
}

/* base */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:17px/1.3 var(--font);letter-spacing:-.01em;color:var(--label);background:var(--bg);min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:20}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.pagewrap{display:contents}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top);z-index:10;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .2s}
.scrolled .nav{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .lead{justify-self:start;display:flex}.nav .trail{justify-self:end;display:flex}
.navtitle{font-weight:600;opacity:0;transition:opacity .2s}
.scrolled .navtitle{opacity:1}
.navicon{width:44px;height:44px;display:grid;place-items:center;color:var(--tint);margin-inline:-10px}
.navicon:active{opacity:.4}
.navicon svg{width:24px;height:24px}

/* page */
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding-top:4px;padding-bottom:120px}
.head{display:flex;flex-direction:column;gap:10px}
.largetitle{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.acctbtn{align-self:flex-start;display:flex;align-items:center;gap:4px;color:var(--tint);font-size:17px;font-weight:600;min-height:32px;margin-top:-6px}
.acctbtn svg{width:18px;height:18px}
.acctbtn:active{opacity:.4}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--cell);border-radius:12px;padding:2px 4px}
.month b{font-weight:600}
.chev{width:44px;height:38px;display:grid;place-items:center;color:var(--tint)}
.chev:disabled{color:var(--label3)}
.chev:active:not(:disabled){opacity:.4}

/* card + tiles */
.card{background:var(--cell);border-radius:12px;padding:14px 16px}
.balance .cap{font-size:15px;color:var(--label2)}
.balance .big{font-size:40px;font-weight:700;line-height:1.15;margin-top:2px;display:block;text-align:right}
.balance.pos .big{color:var(--green-text)}.balance.neg .big{color:var(--red-text)}
.balance .sub{font-size:13px;color:var(--label2);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--cell);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:right}
.tl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.tl i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.tl i svg{width:15px;height:15px}
.tile .v{font-size:22px;font-weight:700;color:var(--label);text-align:right;display:block;margin-top:4px}
.tile .cp{font-size:12px;color:var(--label2)}
.tile .acc{border-top:.5px solid var(--sep);margin-top:6px;padding-top:6px;font-size:12px;color:var(--label2);display:flex;justify-content:space-between;gap:6px}

/* kind colors */
.c-sale{color:var(--green-text)}.c-buy{color:var(--indigo-text)}.c-exp{color:var(--red-text)}.c-cap{color:var(--orange-text)}.c-prof{color:var(--teal)}.c-wine{color:var(--wine-text)}
.b-sale{background:var(--green)}.b-buy{background:var(--indigo)}.b-exp{background:var(--red)}.b-cap{background:var(--orange)}.b-prof{background:var(--teal)}.b-wine{background:var(--wine)}.b-cust{background:var(--tint)}.b-gray{background:var(--gray)}

/* groups */
.sec{display:flex;flex-direction:column;gap:7px}
.sh{font-size:13px;font-weight:400;color:var(--label2);padding:0 16px;display:flex;justify-content:space-between;gap:8px}
.sf{font-size:13px;color:var(--label2);padding:0 16px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.sheet .group{background:var(--sheet-cell)}
.group>*{position:relative}
.group>:not([hidden])~:not([hidden])::before{content:"";position:absolute;top:0;left:0;right:var(--inset,16px);height:.5px;background:var(--sep);z-index:2;pointer-events:none}
.cell{--inset:16px;display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;width:100%;text-align:right;background:transparent}
.withicon{--inset:58px}
.swrow.withicon{--inset:58px}
button.cell:active,a.cell:active{background:var(--fill-press)}
.sq{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.sq svg{width:18px;height:18px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t1.ph{color:var(--label3)}
.t1.wrap,.t2.wrap{white-space:normal}
.t2{font-size:13px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{color:var(--orange-text)}
.bad{color:var(--red-text)}
.val{color:var(--label2);flex:none}
.val.strong{color:var(--orange-text);font-weight:600}
.val.pos{color:var(--green-text)}.val.neg{color:var(--red-text)}
.amt{flex:none;font-weight:500}
.amt.inc{color:var(--green-text)}
.disc{color:var(--label3);flex:none;display:grid}
.disc svg{width:14px;height:14px;stroke-width:2.6}
.checkmark{color:var(--tint);visibility:hidden;flex:none}
[aria-checked="true"] .checkmark{visibility:visible}
.cell.tint{color:var(--tint)}
.cell.tint .sq{color:#fff}
.cell.center{justify-content:center;text-align:center}
.cell.destructive{color:var(--red)}

/* bar row */
.barrow{padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.barrow .top{display:flex;gap:8px;align-items:baseline}
.pct{font-size:15px;color:var(--label2);flex:none;min-width:42px;text-align:left}
.track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--red)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);gap:2px}
.split>i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:13px;color:var(--label2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px;text-align:center;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--seg-sel);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.seg.dense button{font-size:12px;padding:6px 2px}

/* fields */
input.text{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;padding:6px 0}
input::placeholder{color:var(--label3)}
.amountcell{flex-direction:column;align-items:stretch;gap:0;padding:10px 16px}
.amountcell label{font-size:13px;color:var(--label2)}
.amountcell input{font-size:34px;font-weight:700;border:0;background:none;outline:none;font-family:var(--font-num);direction:ltr;text-align:right;width:100%}
.numin{width:96px;flex:none;border:0;background:var(--fill);border-radius:7px;padding:6px 10px;outline:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.numin.short{width:60px;text-align:center}
.datepill{border:0;background:var(--fill);border-radius:7px;padding:6px 10px;outline:none;min-height:34px;-webkit-appearance:none;appearance:none;color:var(--label)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;cursor:pointer}
.switch::before{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06)}
.switch:checked{background:var(--green)}
.switch:checked::before{transform:translateX(-20px)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:8px;flex:none}
.stepper button{width:44px;height:32px;font-size:22px;line-height:1;display:grid;place-items:center}
.stepper button:disabled{color:var(--label3)}
.stepper button:active:not(:disabled){opacity:.4}
.stepper i{width:1px;height:18px;background:var(--sep)}
.errline{color:var(--red-text);font-size:13px;padding:0 16px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.scrim.as{z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 10px);margin:0 auto;max-width:640px;background:var(--sheet);border-radius:13px 13px 0 0;z-index:41;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.18)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:none}
.sheetnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:46px;padding:0 6px;flex:none}
.sheetnav h3{font-size:17px;font-weight:600;text-align:center;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navtext{color:var(--tint);padding:0 10px;height:44px;justify-self:start}
.navtext.trail{font-weight:600;justify-self:end}
.navtext:active{opacity:.4}
.navtext[hidden]{display:block!important;visibility:hidden}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheetbody .inner{display:flex;flex-direction:column;gap:28px;padding:8px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sheetbody .sec{gap:7px}
.sheetbody .tiles .tile{background:var(--sheet-cell)}

/* action sheet */
.actionsheet{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));margin:0 auto;max-width:440px;padding:0 8px;z-index:51;display:flex;flex-direction:column;gap:8px}
.as-group{background:var(--as-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden}
.as-head{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);display:flex;flex-direction:column;gap:3px}
.as-head b{font-weight:600}
.as-btn{display:block;width:100%;text-align:center;font-size:20px;color:var(--tint);padding:16px;border-top:.5px solid var(--sep)}
.as-group>.as-btn:first-child{border-top:0}
.as-btn.destructive{color:var(--red)}
.as-btn:active{background:var(--fill-press)}
.as-cancel{background:var(--sheet-cell);border-radius:14px;font-weight:600;font-size:20px;color:var(--tint);padding:16px;text-align:center}
.as-cancel:active{opacity:.7}

/* banner */
.banner{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;margin:0 auto;max-width:440px;width:calc(100% - 16px);background:var(--as-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;z-index:60}
.banner .grow{display:block}
.banner button{color:var(--tint);font-weight:600}

/* swipe */
.swrow{overflow:hidden}
.swdel{position:absolute;top:0;bottom:0;left:0;width:88px;background:var(--red);color:#fff;font-size:15px;text-align:center}
.swcontent{position:relative;background:var(--cell);touch-action:pan-y;z-index:1}
.sheet .swcontent{background:var(--sheet-cell)}

/* toolbar */
.toolbar{position:fixed;bottom:0;left:0;right:0;padding-top:16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 45%);z-index:9;display:flex;justify-content:center}
.filled{width:100%;max-width:568px;height:50px;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.filled:active{opacity:.75}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 24px;color:var(--label2)}
.empty .ei{width:48px;height:48px;color:var(--label3);stroke-width:1.5;margin-bottom:6px}
.empty b{font-size:20px;font-weight:600;color:var(--label)}
.empty span{font-size:15px}
.empty .cell{margin-top:8px;width:auto}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:sheetup .32s cubic-bezier(.2,.9,.25,1)}
  .actionsheet{animation:sheetup .28s cubic-bezier(.2,.9,.25,1)}
  .scrim{animation:fade .25s}
  .banner{animation:drop .3s cubic-bezier(.2,.9,.25,1)}
  .swcontent{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .switch,.switch::before{transition:background .2s,transform .2s}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
}
</style>
</head>
<body>
<header class="nav gut">
  <div class="lead"><button class="navicon" id="setBtn" aria-label="הגדרות" data-ic="settings"></button></div>
  <div class="navtitle" id="navTitle">המרתף</div>
  <div class="trail"><button class="navicon" id="addBtn" aria-label="הוספה" data-ic="plus"></button></div>
</header>

<main class="app gut" id="app">
  <div class="head">
    <h1 class="largetitle">המרתף</h1>
    <button class="acctbtn" id="acctBtn" hidden><span id="acctName"></span><span data-ic="chevD"></span></button>
    <div class="month">
      <button class="chev" id="prevM" aria-label="החודש הקודם" data-ic="chevR"></button>
      <b id="mLabel"></b>
      <button class="chev" id="nextM" aria-label="החודש הבא" data-ic="chevL"></button>
    </div>
  </div>
  <div id="main" class="pagewrap"></div>
</main>

<div class="toolbar gut"><button class="filled" id="saleBtn"><span data-ic="plus"></span>מכירה חדשה</button></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber"></div>
  <div class="sheetnav"><button class="navtext" id="sheetLead"></button><h3 id="sheetTitle"></h3><button class="navtext trail" id="sheetTrail"></button></div>
  <div class="sheetbody" id="sheetBody"><div class="inner" id="sheetInner"></div></div>
</div>
<input type="file" id="restoreIn" accept="application/json,.json" hidden>

<script>
(()=>{
"use strict";
/* ---------- constants ---------- */
const K={wines:"cel-wines-v1",custs:"cel-customers-v1",txs:"cel-txs-v1",theme:"cel-theme",backup:"cel-last-backup"};
const KN={sale:"מכירה",buy:"קנייה",exp:"הוצאה"};
const WTYPES={red:"אדום",white:"לבן",rose:"רוזה",spark:"מבעבע",dessert:"קינוח",other:"אחר"};
const EXPCATS=["משלוחים","אחסון וקירור","שיווק ופרסום","אריזות ומיתוג","רישוי ומיסים","עמלות תשלום","דלק ונסיעות","טעימות ודוגמאות","תוכנה ושירותים","אחר"];
const PAYS={cash:"מזומן",bit:"ביט / פייבוקס",transfer:"העברה בנקאית",credit:"אשראי",check:"צ׳ק"};

/* ---------- icons ---------- */
const ICONS={
  plus:'<path d="M12 5v14M5 12h14"/>',
  settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',chevR:'<path d="M9 6l6 6-6 6"/>',chevD:'<path d="M6 9l6 6 6-6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  wine:'<path d="M7 3h10v5a5 5 0 0 1-10 0V3zM12 13v8M8 21h8M7.3 7h9.4"/>',
  sale:'<path d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 0 1 6 0v2"/>',
  buy:'<path d="M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5v-9zM3 7.5l9 4.5 9-4.5M12 12v9"/>',
  exp:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/>',
  prof:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cap:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zM3 7l2-3h12l1 3M16 13.5h2"/>',

/* ---------- cost engine (moving average) ---------- */
function compute(ex){
  const tl=txs.filter(t=>t.id!==ex&&t.kind!=="exp");
  const tot={};
  for(const t of tl)if(t.kind==="buy")for(const l of t.lines){const o=tot[l.w]||(tot[l.w]={q:0,v:0});o.q+=l.q;o.v+=l.q*l.p}
  const st={},cost={};
  for(const t of tl.slice().sort(byDate)){
    if(t.kind==="buy"){for(const l of t.lines){const o=st[l.w]||(st[l.w]={q:0,v:0});
      if(o.q<0){const a=tot[l.w].v/tot[l.w].q;o.v=o.q*a}
      o.q+=l.q;o.v+=l.q*l.p}}
    else cost[t.id]=t.lines.map(l=>{const o=st[l.w]||(st[l.w]={q:0,v:0});
      const a=o.q>0?o.v/o.q:(tot[l.w]?tot[l.w].v/tot[l.w].q:0);
      const c=l.q*a;o.q-=l.q;o.v=o.q>0?o.v-c:o.q*a;return c});
  }
  const avg=w=>{const o=st[w];if(o&&o.q>0)return o.v/o.q;const b=tot[w];return b&&b.q?b.v/b.q:0};
  return{st,cost,avg,stock:w=>st[w]?st[w].q:0,hasCost:w=>!!tot[w]};
}
let C=compute();

function monthSum(m){
  const r={rev:0,cogs:0,bottles:0,nSales:0,exp:0,nExp:0,buy:0,nBuy:0,cin:0,wines:{},custs:{},cats:{}};
  for(const t of txs){const inM=monthOf(t.date)===m;
    if(t.kind==="sale"){
      if(inM){const rv=linesTot(t),cs=tcost(t);r.rev+=rv;r.cogs+=cs;r.nSales++;
        t.lines.forEach((l,i)=>{const o=r.wines[l.w]||(r.wines[l.w]={rev:0,prof:0,q:0});const lr=l.q*l.p,lc=(C.cost[t.id]||[])[i]||0;o.rev+=lr;o.prof+=lr-lc;o.q+=l.q;r.bottles+=l.q});
        const ck=t.cust||"_";const o=r.custs[ck]||(r.custs[ck]={rev:0,prof:0,n:0});o.rev+=rv;o.prof+=rv-cs;o.n++}
      if(t.paid&&monthOf(t.paidDate||t.date)===m)r.cin+=linesTot(t);
    }else if(t.kind==="buy"&&inM){r.buy+=linesTot(t);r.nBuy++}
    else if(t.kind==="exp"&&inM){r.exp+=t.amount;r.nExp++;r.cats[t.cat]=(r.cats[t.cat]||0)+t.amount}
  }
  r.gp=r.rev-r.cogs;r.net=r.gp-r.exp;r.cout=r.buy+r.exp;r.flow=r.cin-r.cout;return r;
}
function capital(){
  let q=0,v=0,pv=0,noPrice=0;
  for(const w of wines){const o=C.st[w.id];if(o&&o.q>0){q+=o.q;v+=o.v;if(w.price>0)pv+=o.q*w.price;else{pv+=o.v;noPrice++}}}
  const from=addDays(todayStr(),-90);let c90=0,gpAll=0,expAll=0,debt=0,nDebt=0,invested=0;
  for(const t of txs){
    if(t.kind==="sale"){const cs=tcost(t),rv=linesTot(t);gpAll+=rv-cs;if(t.date>=from)c90+=cs;if(!t.paid){debt+=rv;nDebt++}}
    else if(t.kind==="exp")expAll+=t.amount;else invested+=linesTot(t);
  }
  const daily=c90/90;
  return{q,v,pv,noPrice,days:daily>0&&v>0?Math.round(v/daily):null,turns:v>0&&c90>0?(c90*365/90)/v:null,gpAll,netAll:gpAll-expAll,debt,nDebt,invested};
}
function cstats(cid,ex){
  const ss=txs.filter(t=>t.kind==="sale"&&t.cust===cid&&t.id!==ex).sort(byDateDesc);
  let rev=0,prof=0,debt=0;const wq={};
  for(const t of ss){const rv=linesTot(t);rev+=rv;prof+=rv-tcost(t);if(!t.paid)debt+=rv;
    for(const l of t.lines){const o=wq[l.w]||(wq[l.w]={q:0,last:null});o.q+=l.q;if(o.last==null)o.last=l.p}}
  return{sales:ss,n:ss.length,rev,prof,debt,last:ss[0]||null,wq};
}

}

    ch.setUint32(16,c,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);

  if(tc.length&&!(tc.length===1&&tc[0][0]==="_"))M.append(sec("הלקוחות הגדולים ב"+monthName(cur),grp(...tc.map(([c,o])=>h(c==="_"?"div":"button",{class:"cell withicon",onclick:c==="_"?null:()=>{openSheet(custsPage());push(custPage(c))}},sq(c==="_"?"gray":"cust","user"),
    h("span",{class:"grow"},h("span",{class:"t1"},c==="_"?"ללא שם":custName(c)),h("span",{class:"t2"},o.n+(o.n===1?" הזמנה":" הזמנות")+" · רווח "+money(o.prof))),nm(o.rev,false,"val"),c!=="_"&&disc())))));
  // expenses by cat
  const ec=Object.entries(r.cats).sort((a,b)=>b[1]-a[1]);
  if(ec.length)M.append(sec("הוצאות לפי קטגוריה",grp(...ec.map(([c,v])=>barRow(c,v,v,r.exp,"b-exp")))));
  // list
  const seg=h("div",{class:"seg"},...[["all","הכול"],["sale","מכירות"],["buy","קניות"],["exp","הוצאות"]].map(([k,l])=>h("button",{"data-f":k,onclick:()=>{filter=k;render()}},l)));
  setSeg(seg,"f",filter);M.append(seg);
  const list=txs.filter(t=>monthOf(t.date)===cur&&(filter==="all"||t.kind===filter)).sort(byDateDesc);
  if(!list.length){const any=txs.some(t=>monthOf(t.date)===cur);
    M.append(h("div",{class:"empty"},h("span",{class:"ei",html:icon(filter==="all"?"wine":filter)}),h("b",null,any?"אין "+({sale:"מכירות",buy:"קניות",exp:"הוצאות"}[filter])+" בחודש הזה":"אין תנועות ב"+monthName(cur)),h("span",null,any?"נסו סינון אחר.":"הקישו על \"מכירה חדשה\", או על + כדי לרשום קנייה או הוצאה.")))}
  else{let day=null,g=null;
    for(const t of list){if(t.date!==day){day=t.date;g=grp();
        const dt=list.filter(x=>x.date===day);const inc=dt.filter(x=>x.kind==="sale").reduce((s,x)=>s+linesTot(x),0);
        M.append(sec(h("span",{style:"display:contents"},h("span",null,dayLabel(day)),inc>0&&h("span",null,"מכירות ",nm(inc))),g))}
      g.append(txRow(t))}
    M.append(sf("החליקו שורה ימינה כדי למחוק אותה."))}
}
function refreshAll(){render();if(stack.length)rerender()}

  ...accounts.filter(a=>a.id!==acc).map(a=>({label:a.name,fn:()=>{switchAccount(a.id);banner("עברתם לחשבון "+a.name)}})),
  {label:"ניהול חשבונות",fn:()=>{openSheet(settingsPage());push(accountsPage())}}]}));
$("addBtn").addEventListener("click",()=>actionSheet({buttons:[
  {label:"מכירה",fn:()=>openSheet(txPage(null,{kind:"sale"}))},
  {label:"קניית סחורה",fn:()=>openSheet(txPage(null,{kind:"buy"}))},
  {label:"הוצאה",fn:()=>openSheet(txPage(null,{kind:"exp"}))},

  {label:"לקוח חדש",fn:()=>openSheet(custForm(null))}]}));

render();
